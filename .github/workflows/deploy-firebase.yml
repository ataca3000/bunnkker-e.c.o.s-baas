name: 🚀 BUNKKER — Deploy a Firebase Hosting

on:
  push:
    branches: [ main ]
  workflow_dispatch: # Permite ejecutar manualmente desde GitHub UI

jobs:
  build-and-deploy:
    name: Build Next.js y Deploy a Firebase
    runs-on: ubuntu-latest
    # Dar 16 GB de RAM al runner (plan gratuito de GitHub usa ubuntu-latest con 7GB,
    # pero podemos optimizar el build con NODE_OPTIONS)

    steps:
      # ── 1. Checkout del código ──────────────────────────────────────────────
      - name: 📥 Checkout
        uses: actions/checkout@v4

      # ── 2. Setup Node.js ───────────────────────────────────────────────────
      - name: 🟢 Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # ── 2.5 Caché de Next.js build ─────────────────────────────────────────
      - name: 🗄️ Caché Next.js
        uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            ${{ github.workspace }}/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-${{ hashFiles('**/*.js', '**/*.jsx', '**/*.ts', '**/*.tsx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-

      # ── 3. Instalar dependencias ───────────────────────────────────────────
      - name: Instalar dependencias
        run: npm install --prefer-offline --no-audit --no-fund

      # ── 5. Ejecutar tests antes de desplegar ───────────────────────────────
      - name: 🧪 Tests
        run: npm test -- --run
        continue-on-error: true  # Tests de SQLite/clasificador requieren entorno local; no bloquean el deploy
        env:
          NODE_ENV: test
          CI: true
          DATABASE_URL: file:/tmp/bunkker-build.db

      # ── 6. Build Next.js para web (modo NO standalone) ─────────────────────
      - name: 🔨 Build Next.js (modo web)
        run: npm run build:web
        # Inyectamos los secretos como variables de entorno directamente en el proceso de build.
        # Esto evita escribirlos en un archivo .env.local, que es un riesgo de seguridad.
        env:
          NODE_OPTIONS: "--max-old-space-size=6144"
          BUILD_TARGET: web
          NEXT_PUBLIC_APP_ENV: nube
          DATABASE_URL: file:/tmp/bunkker-build.db
          NEXT_TELEMETRY_DISABLED: 1
          NEXT_PUBLIC_FIREBASE_API_KEY: ${{ secrets.NEXT_PUBLIC_FIREBASE_API_KEY }}
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ secrets.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ secrets.NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET }}
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
          NEXT_PUBLIC_FIREBASE_APP_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_APP_ID }}
          NEXT_PUBLIC_APP_URL: https://admin-erp-pro-1.web.app

      # ── 7. Deploy a Firebase Hosting ───────────────────────────────────────
      - name: 🔥 Deploy a Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: admin-erp-pro-1
          channelId: live
          # Solo desplegamos hosting y reglas — las funciones no aplican aquí
          target: hosting

      # ── 8. Resumen del deploy ───────────────────────────────────────────────
      - name: ✅ Deploy completado
        run: |
          echo "🚀 BUNKKER E.C.O.S ERP desplegado exitosamente"
          echo "🌐 URL: https://admin-erp-pro-1.web.app"
          echo "📅 $(date)"
