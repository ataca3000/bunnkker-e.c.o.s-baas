name: Deploy BUNKKER Demo to Hugging Face Space

on:
  workflow_dispatch:
    inputs:
      space_id:
        description: "ID del Space destino en Hugging Face (usuario/nombre)"
        required: true
        default: "Elcalarmar/Bunkker-e-c-o-s"
  push:
    branches: ["main"]
    paths:
      - "src/**"
      - "prisma/**"
      - "public/**"
      - "hf-space/**"
      - "scripts/deploy-hf-space.sh"
      - "package*.json"
      - "next.config.ts"

concurrency:
  group: "hf-space-deploy"
  cancel-in-progress: true

jobs:
  deploy-space:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate HF_TOKEN secret
        run: |
          if [ -z "${{ secrets.HF_TOKEN }}" ]; then
            echo "ERROR: Falta el secreto HF_TOKEN en Settings -> Secrets and variables -> Actions."
            exit 1
          fi

      - name: Sync BUNKKER Docker Space to Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE_ID: ${{ github.event.inputs.space_id || 'Elcalarmar/Bunkker-e-c-o-s' }}
        run: bash scripts/deploy-hf-space.sh
