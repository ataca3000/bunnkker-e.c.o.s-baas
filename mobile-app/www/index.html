<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Bunkker ECOS - Terminal</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0f172a;
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }
        .container {
            background: rgba(30, 41, 59, 0.8);
            padding: 2rem;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            text-align: center;
            width: 85%;
            max-width: 400px;
        }
        h1 {
            color: #0ea5e9;
            margin-bottom: 0.5rem;
        }
        p {
            color: #94a3b8;
            font-size: 0.9rem;
            margin-bottom: 2rem;
        }
        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 1rem;
            border-radius: 8px;
            border: 1px solid #334155;
            background: #1e293b;
            color: #fff;
            font-size: 1rem;
            box-sizing: border-box;
            text-align: center;
        }
        button {
            width: 100%;
            padding: 14px;
            border-radius: 8px;
            border: none;
            background: linear-gradient(135deg, #0ea5e9, #3b82f6);
            color: #fff;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s;
        }
        button:active {
            transform: scale(0.95);
        }
        .reset-btn {
            background: transparent;
            color: #ef4444;
            font-size: 0.8rem;
            margin-top: 1rem;
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="container" id="setup-screen" style="display: none;">
        <h1>Terminal Móvil</h1>
        <p>Ingresa la IP de la computadora principal para vincular este dispositivo.</p>
        
        <input type="text" id="ip-input" placeholder="Ej. 192.168.1.5" />
        <button onclick="connectServer()">CONECTAR</button>
    </div>

    <div id="loading-screen">
        <h2 style="color: #0ea5e9;">Conectando...</h2>
        <button class="reset-btn" onclick="resetIP()">Cambiar Servidor</button>
    </div>

    <script>
        function checkConnection() {
            const savedIP = localStorage.getItem('bunkker_server_ip');
            if (savedIP) {
                document.getElementById('setup-screen').style.display = 'none';
                document.getElementById('loading-screen').style.display = 'block';
                // Agregar protocolo y puerto (asumiendo que corre en puerto 3000 por defecto en la PC)
                let url = savedIP;
                if (!url.startsWith('http')) {
                    url = 'http://' + url + ':3000';
                }
                setTimeout(() => {
                    window.location.href = url;
                }, 1000);
            } else {
                document.getElementById('setup-screen').style.display = 'block';
                document.getElementById('loading-screen').style.display = 'none';
            }
        }

        function connectServer() {
            const ip = document.getElementById('ip-input').value.trim();
            if (ip) {
                localStorage.setItem('bunkker_server_ip', ip);
                checkConnection();
            } else {
                alert('Por favor, ingresa una IP válida.');
            }
        }

        function resetIP() {
            localStorage.removeItem('bunkker_server_ip');
            checkConnection();
        }

        // Si la URL principal falla al cargar, podemos añadir lógica después para regresar aquí.
        // Por ahora, el usuario puede limpiar datos desde la app de Android si necesita resetear.
        window.onload = checkConnection;
    </script>
</body>
</html>
